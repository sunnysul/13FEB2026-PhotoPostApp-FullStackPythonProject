<nav class="bg-gradient-to-r from-purple-600 to-blue-600 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center space-x-2">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"/>
          </svg>
          <span class="text-white text-xl font-bold">PhotoPost</span>
        </a>
        <div class="hidden md:flex ml-10 space-x-4">
          <a routerLink="/" routerLinkActive="bg-blue-700" [routerLinkActiveOptions]="{exact: true}"
             class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition">
            Home
          </a>
          @if (authService.isAuthenticated()) {
            <a routerLink="/my-posts" routerLinkActive="bg-blue-700"
               class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition">
              My Posts
            </a>
            <a routerLink="/create-post" routerLinkActive="bg-blue-700"
               class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition">
              Create Post
            </a>
          }
          @if (authService.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="bg-blue-700"
               class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition">
              Admin
            </a>
          }
        </div>
      </div>
      <div class="flex items-center space-x-4">
        @if (authService.isAuthenticated()) {
          <div class="flex items-center space-x-4">
            <span class="text-white text-sm">
              Hello, {{ authService.currentUser()?.username }}
              @if (authService.isAdmin()) {
                <span class="ml-1 px-2 py-1 text-xs bg-yellow-500 text-black rounded">Admin</span>
              }
            </span>
            <button (click)="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium transition">
              Logout
            </button>
          </div>
        } @else {
          <div class="flex space-x-2">
            <a routerLink="/login"
               class="bg-white text-purple-600 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-100 transition">
              Login
            </a>
            <a routerLink="/register"
               class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md text-sm font-medium transition">
              Register
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
