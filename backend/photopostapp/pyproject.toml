[project]
name = "photopostapp"
version = "0.1.0"
description = "A Flask-based photo post application with JWT auth and RBAC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "flask-jwt-extended>=4.7.1",
    "flask-restful>=0.3.10",
    "flask-sqlalchemy>=3.1.1",
]
